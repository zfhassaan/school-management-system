name: CI

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'internal/**'
      - 'database/**'
      - 'tests/**'
      - 'wails.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'cmd/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'internal/**'
      - 'database/**'
      - 'tests/**'
      - 'wails.json'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go vet and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v ./...

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
