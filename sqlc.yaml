version: "2"
sql:
  - engine: "sqlite"
    schema: "database/migrations/sqlite"
    queries: "database/queries/sqlite"
    gen:
      go:
        package: "sqlite"
        out: "internal/infrastructure/database/sqlite"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true

